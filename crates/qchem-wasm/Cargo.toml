[package]
name = "qchem-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for the qchem engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qchem = { path = "../qchem" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
